<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Authorities — PDF preparation</title>
<style>
:root{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#24323b;background:#f4f3ef;--accent:#164c49;--muted:#637078;--line:#dadfdc}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{border:1px solid #cbd4d0;background:#fff;color:#24323b;border-radius:6px;padding:7px 12px;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent);background:#f0f7f4}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #86bfb6;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover:not(:disabled){background:#216560;color:#fff}a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}h1,h2,h3,p{margin:0}header{max-width:1320px;margin:0 auto;padding:27px 32px 21px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font:600 29px/1.2 Georgia,serif;letter-spacing:-.5px}.subtitle{color:var(--muted);margin-top:6px;font-size:14px}.header-actions{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1320px;margin:0 auto;padding:0 32px 32px}.workspace{display:grid;grid-template-columns:minmax(300px,.95fr) minmax(360px,1.05fr);gap:22px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h2{font-size:16px;font-weight:650}small,.muted{color:var(--muted)}textarea{width:100%;min-height:340px;resize:vertical;padding:14px;border:1px solid #c7d1cc;border-radius:6px;line-height:1.65;background:#fdfdfb}textarea::placeholder{color:#7e898c}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.drop{width:100%;margin-top:18px;border:1px dashed #9aada4;background:#fafcfb;padding:27px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}.drop small{font-size:12px}.dragover{background:#e2f2e9!important;border-color:#287458!important}.settings{margin-top:18px;font-size:13px}.settings summary{cursor:pointer;color:var(--accent);font-weight:600}.settings label{display:block;margin-top:11px}.settings input{width:100%;border:1px solid #ccd6d0;border-radius:5px;padding:8px;margin-top:4px}.settings p{margin:10px 0;color:var(--muted)}#notice{min-height:26px;font-size:13px;margin:12px 0;color:#7b4820;overflow-wrap:anywhere}.record{padding:17px 0;border-bottom:1px solid #e4e7e4}.record:first-child{padding-top:4px}.record:last-child{border:0;padding-bottom:0}.record-heading{display:flex;gap:12px;align-items:flex-start}.record-heading input{margin-top:5px;accent-color:var(--accent)}.record-title{display:block;font-size:15px;font-weight:600}.record-title strong{font:inherit}.citation{font:inherit;color:inherit}.targets{display:flex;gap:6px;flex-wrap:wrap;padding-left:27px;margin-top:9px}.target{font-size:12px;padding:4px 8px;background:#eef5f1;border-color:#dfebe3}.target:disabled{opacity:1;color:#426152}.target.unresolved{background:#fff3df;color:#80552c}.status{margin:8px 0 9px 27px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.row-actions{padding-left:27px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}.row-actions button{font-size:12px;padding:4px 9px}.empty{padding:45px 15px;text-align:center;color:var(--muted)}.row-actions a.ext-link{color:#1a5fb4;text-decoration:underline;font-weight:500}.row-actions a.ext-link:hover{color:#0f3f7a}[hidden]{display:none!important}
#viewer{position:fixed;inset:0;background:#f0f1ee;z-index:10;display:flex;flex-direction:column}.viewer-top{padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center}.viewer-heading{flex:1;min-width:0}.viewer-heading h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-heading p{font-size:12px;color:var(--muted)}.viewer-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 320px}.page-jump{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}.page-jump input{width:58px;padding:4px 6px;border:1px solid #cbd4cf;border-radius:4px;text-align:right}.viewer-side{padding:14px 14px 24px;background:#fff;border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:12px}.viewer-side h3{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}.viewer-tools{display:flex;gap:6px}.viewer-tools #undo{margin-left:auto}.viewer-tools button{font-size:12px;padding:6px 10px}.viewer-tools #undo,.viewer-tools #redo{padding:6px 9px;font-size:14px;line-height:1}.viewer-tools [aria-pressed=true]{background:#e2f2e9;border-color:var(--accent)}.style-panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fafbf9;display:flex;flex-direction:column;gap:8px}.style-scope{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.style-row{display:flex;align-items:center;gap:10px;font-size:12px}.swatches{display:flex;gap:6px;flex:1}.swatch-button{width:24px;height:24px;padding:0;border-radius:50%;border:1px solid #0002}.swatch-button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}.style-row input[type=color]{border:0;width:28px;height:26px;padding:0;background:none;cursor:pointer}.style-row input[type=range]{flex:1;accent-color:var(--accent)}.style-row output{width:34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}#highlight-list{display:flex;flex-direction:column;gap:6px}.highlight-row{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}.highlight-row:hover{border-color:#b9c7c1}.highlight-row.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.highlight-row button{border:0;border-radius:0;background:transparent}.highlight-row .card-main{flex:1;min-width:0;text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:3px}.highlight-row button:hover:not(:disabled){background:#f4f8f6}.card-head{display:flex;align-items:center;gap:7px;font-size:12px;min-width:0}.card-head strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-dot{flex:none;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px #0002}.card-page{margin-left:auto;flex:none;color:var(--muted);font-size:11px}.card-excerpt{font-size:11.5px;line-height:1.4;color:#56636a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.highlight-row .card-delete{flex:none;width:28px;padding:0;color:var(--muted);font-size:16px}.highlight-row .card-delete:hover:not(:disabled){color:#9b2c2c;background:#fbeeee}.cards-empty{font-size:12px;color:var(--muted)}.warning{padding:8px 10px;font-size:12px;color:#82572d;background:#fff6e9;border-radius:7px}.page-area{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}#page-scroll{overflow:auto;min-height:0;flex:1;padding:20px 24px 60px;position:relative}#page-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}.pdf-page{position:relative;flex:none;box-shadow:0 2px 14px #0002;background:#fff}.pdf-page canvas{display:block;width:100%;height:100%}.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;opacity:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}.textLayer span.markedContent{top:0;height:0}.textLayer ::selection{background:rgba(30,120,230,.28)}.textLayer .ocr-line{overflow:hidden;line-height:1;white-space:nowrap}.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}.textLayer.selecting .endOfContent{top:0}.marks{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:multiply}.mark-group{position:absolute;inset:0}.mark{position:absolute;border-radius:2px}.mark-ring{position:absolute;border-radius:3px;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #b07a00;margin:-2px;padding:2px;box-sizing:content-box}.draw-layer{display:none;position:absolute;inset:0;z-index:4;cursor:crosshair;touch-action:none}.drawing .draw-layer{display:block}.draft-mark{position:absolute;background:#ffd84d55;outline:1px solid #ab8500}
@media(max-width:850px){header{padding:22px 18px}.workspace{grid-template-columns:1fr}main{padding:0 18px 24px}.viewer-body{grid-template-columns:1fr 240px}.viewer-side{padding:12px}.page-jump{display:none}.header-actions{font-size:12px}.header-actions button{padding:6px 9px}}
</style></head><body>
<header><div><h1>Authorities</h1><p class="subtitle">Original PDFs. The passages you need, highlighted.</p></div><div class="header-actions"><button id="fetch-downloads" title="Choose a folder; PDFs saved there in the last day and named like 2019abqb666.pdf are added to their authorities">Auto-fetch from folder</button><button id="download-all" disabled>Download all</button></div></header>
<main><div class="workspace"><section><div class="panel"><div class="panel-heading"><h2>Paste your instructions</h2></div><textarea id="paste" aria-label="Authority citations and highlighting instructions" placeholder="Paste an email, a list of citations, or instructions with paragraph numbers…"></textarea><div class="toolbar"><button id="find" class="primary" disabled>Find PDFs & highlight</button><button id="cancel" hidden>Cancel</button></div><button id="drop" class="drop"><strong>Click or drag to add PDFs</strong><small>Multiple files accepted. Matching citations are associated automatically.</small></button><input id="pdf-files" type="file" accept="application/pdf,.pdf" multiple hidden><input id="downloads-folder" type="file" webkitdirectory hidden></div><p id="notice" role="status" aria-live="polite">Loading the local parser…</p></section><section class="panel"><div class="panel-heading"><h2>Your authorities</h2><small id="record-count"></small></div><p id="empty" class="empty">Paste instructions to see citations and requested passages here.</p><div id="records"></div></section></div></main>
<section id="viewer" hidden aria-label="PDF highlight review"><div class="viewer-top"><button id="close-viewer">← Authorities</button><div class="viewer-heading"><h2 id="viewer-title"></h2><p id="viewer-citation"></p></div><label class="page-jump">Page <input id="page-number" type="number" min="1" value="1" aria-label="Go to page"><span id="page-count"></span></label><button id="viewer-download" class="primary">Download PDF</button></div><div class="viewer-body"><div class="page-area"><div id="page-scroll"><div id="page-wrap"></div></div></div><aside class="viewer-side"><div class="viewer-tools"><button id="selection-highlight" title="Highlight the selected text">Highlight text</button><button id="area-highlight" aria-pressed="false">Draw box</button><button id="undo" disabled aria-label="Undo">↶</button><button id="redo" disabled aria-label="Redo">↷</button></div><div class="style-panel"><p class="style-scope" id="style-scope">All highlights</p><div class="style-row"><div id="swatches" class="swatches"></div><input id="colour" type="color" aria-label="Custom colour" title="Custom colour"></div><label class="style-row">Opacity<input id="opacity" type="range" min=".1" max=".8" step=".05"><output id="opacity-value"></output></label></div><h3 id="viewer-summary">Highlights</h3><div id="highlight-list"></div></aside></div></section>
<!--BUNDLE-->
</body></html>
