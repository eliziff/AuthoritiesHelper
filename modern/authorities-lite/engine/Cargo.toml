[package]
name = "authorities-browser-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
legal-structure = { path = "../../../../legal-structure", features = ["provider-text", "citator", "document-query"] }
serde_json = "1.0"

# legal-structure pins common-law-cite by revision; the engine builds the checkout beside it, as it does legal-structure.
[patch."https://github.com/eliziff/common-law-cite.git"]
legal-citations = { path = "../../../../common-law-cite/crates/legal-citations" }
legal-text = { path = "../../../../common-law-cite/crates/legal-text" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
