[package]
name = "authorities-browser-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
legal-structure = { git = "https://github.com/eliziff/legal-structure-parser.git", rev = "d7cd5fa24b690b8745eb415d228c4f434cc63c67", features = ["provider-text", "citator", "document-query"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
